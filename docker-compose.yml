version: '3.8'

services:
  gilded-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gilded_space
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@localhost:5432/gilded}
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gold.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
    volumes:
      - ./server/uploads:/app/server/uploads
