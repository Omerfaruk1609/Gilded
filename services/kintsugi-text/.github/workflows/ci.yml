name: KintsugiText CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Seed Database Test
        run: npm run seed

      - name: Build Playground UI
        run: npm run build:playground

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: npm run test:backend

      - name: Run Python AI Service Tests
        run: npm run test:ai

      - name: Run AI Model Benchmark Suite
        run: npm run test:benchmark
